<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Portal — Agent (Redesigned Flow)</title>
<style>
  :root{
    --green:#1aa05a; --green-d:#15803d; --green-2:#22b365; --green-l:#dcfce7; --green-bg:#f0fdf6;
    --orange:#ef9b0a; --orange-bg:#fff7e6;
    --bg:#f4f6f8; --card:#ffffff; --bd:#e6e8eb; --bd2:#eef0f2;
    --ink:#1f2733; --mut:#6b7280; --mut2:#9aa3af;
    --red:#dc2626; --red-bg:#fef2f2; --red-bd:#fbcdce;
    --blue:#2563eb; --blue-bg:#eff6ff; --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fde68a;
    --chat:#d9d2c4;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.08);
    --shadow-lg:0 12px 34px rgba(16,24,40,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Roboto,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px}
  .app{display:flex;min-height:100vh}
  /* ---------- icon rail ---------- */
  .rail{width:54px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:12px 0;flex-shrink:0;gap:4px;position:relative}
  .rail .r{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#7b8595;cursor:pointer;font-size:17px}
  .rail .r:hover{background:#f3f4f6}
  .rail .r.on{background:var(--green-bg);color:var(--green-d)}
  .rail .sp{flex:1}
  .rail .pp{width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;margin-top:6px}
  /* ---------- timeline / left panel ---------- */
  .lpane{width:286px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
  .lpane .ph{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--bd2);font-weight:700;font-size:13px;color:#374151}
  .lpane .ph .x{margin-left:auto;color:var(--mut2);cursor:pointer}
  .ttabs{display:flex;border-bottom:1px solid var(--bd2)}
  .ttabs a{flex:1;text-align:center;padding:10px 4px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
  .ttabs a.on{color:var(--green-d);border-bottom-color:var(--green)}
  .tbody{flex:1;padding:14px 15px;overflow:auto}
  .actv{display:flex;gap:10px;align-items:flex-start;color:var(--mut)}
  .actv .dot{width:30px;height:30px;border-radius:50%;background:#f0f2f4;display:grid;place-items:center;flex-shrink:0}
  .cust{border-top:1px solid var(--bd2);padding:13px 15px}
  .cust .lab{font-size:10px;letter-spacing:.07em;color:var(--mut2);font-weight:700;text-transform:uppercase;margin-bottom:9px}
  .cust .row{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px;color:#374151}
  .cust .row .ic{width:15px;text-align:center;color:var(--mut2)}
  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .urlbar{height:30px;background:#eef0f3;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;font-size:11.5px;color:#8a93a0;gap:7px}
  .urlbar .lock{color:var(--green-d)}
  .topbar{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .lhead{display:flex;align-items:center;gap:11px;flex:1 1 300px;min-width:0}
  .lhead .av{width:40px;height:40px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
  .lhead h2{margin:0;font-size:15.5px;font-weight:800;white-space:nowrap}
  .ids{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
  .tbtns{display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
  .idpill{background:#f1f3f5;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font-size:10.5px;color:#5b6473;font-weight:600;display:inline-flex;gap:4px;align-items:center}
  .content{padding:16px 18px;overflow:auto;flex:1}
  .dial{display:flex;gap:7px;align-items:center;background:#f1f3f5;border-radius:9px;padding:4px 4px 4px 11px}
  .dial input{border:0;background:transparent;outline:0;width:140px;font-size:12.5px}
  /* ---------- right chat ---------- */
  .chat{width:300px;background:var(--chat);border-left:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;background-image:radial-gradient(#cabfac 1px,transparent 1px);background-size:18px 18px}
  .chat .ch{background:linear-gradient(90deg,var(--green),var(--green-2));color:#fff;padding:9px 13px;display:flex;align-items:center;gap:10px}
  .chat .ch .a{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800}
  .chat .ch b{font-size:13.5px;display:block;line-height:1.2}
  .chat .ch small{font-size:11px;opacity:.92}
  .chat .ch .poll{margin-left:auto;font-size:10.5px;display:flex;align-items:center;gap:5px}
  .chat .ch .poll i{width:7px;height:7px;border-radius:50%;background:#ffd34d;display:inline-block}
  .chat .cb{flex:1;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .chat .day{align-self:center;background:#fff;border-radius:7px;padding:2px 10px;font-size:10.5px;color:#6b7280;box-shadow:var(--shadow)}
  .chat .bub{align-self:flex-end;background:#dcf8c6;border-radius:9px 9px 2px 9px;padding:6px 10px;font-size:12.5px;max-width:75%;box-shadow:var(--shadow)}
  .chat .bub small{display:block;text-align:right;color:#7b8a6e;font-size:9.5px;margin-top:2px}
  .chat .cf{background:#f0f2f5;padding:8px 10px;display:flex;align-items:center;gap:8px}
  .chat .cf input{flex:1;border:0;border-radius:18px;padding:9px 13px;outline:0;font-size:12.5px}
  .chat .cf .snd{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer}
  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;color:#374151}
  .btn:hover{background:#f9fafb}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff}
  .btn.green:hover{background:var(--green-d)}
  .btn.greenbright{background:linear-gradient(180deg,var(--green-2),var(--green));border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(26,160,90,.35)}
  .btn.red{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
  .btn.pill{border-radius:999px}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn.lg{padding:12px 22px;font-size:14px;border-radius:11px}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  /* ---------- pipeline (chevrons) ---------- */
  .pipecard{background:#fff;border:1px solid var(--bd);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .pipehd{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .pipehd .pi{width:30px;height:30px;border-radius:8px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center}
  .pipehd b{font-size:14px}.pipehd small{display:block;color:var(--mut2);font-size:11px;font-weight:600;letter-spacing:.04em}
  .lp{display:flex;gap:0}
  .lp .stp{flex:1;min-width:0;background:var(--green);color:#fff;font-size:11px;font-weight:700;text-align:center;padding:9px 6px 9px 18px;margin-right:-9px;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp .stp:first-child{clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);padding-left:12px}
  .lp .stp.now{background:var(--orange)}
  .lp .stp.todo{background:#e9ecef;color:#9aa3af}
  .lp .prog{height:5px;border-radius:3px;background:#e9ecef;margin-top:11px;overflow:hidden}
  .lp .prog i{display:block;height:100%;background:var(--green)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin-top:9px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
  /* ---------- step cards ---------- */
  .step{background:#fff;border:1px solid var(--bd);border-radius:13px;box-shadow:var(--shadow);margin-bottom:14px;max-width:none}
  .step .sh{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--bd2)}
  .snum{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
  .snum.todo{background:#e5e7eb;color:#9ca3af}
  .step .sh b{font-size:14px}.step .sh small{display:block;color:var(--mut);font-size:11.5px;font-weight:500;margin-top:1px}
  .step .sb{padding:16px}
  /* ---------- fields ---------- */
  .field label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;outline:0;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
  .field input::placeholder{color:#b6bcc6}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
  .req:after{content:" *";color:var(--red)}
  .seclab{font-size:11px;color:var(--mut2);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  /* chips / radios */
  .chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:#374151}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .chip.dash{border-style:dashed}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .radseg{display:flex;gap:10px;flex-wrap:wrap}
  .rad{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:11px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;font-size:12.5px}
  .rad.on{border-color:var(--green);background:var(--green-bg);color:var(--green-d)}
  .rad .rc{width:16px;height:16px;border-radius:50%;border:2px solid #c2c9d2;flex-shrink:0}
  .rad.on .rc{border-color:var(--green);background:radial-gradient(var(--green) 40%,#fff 45%)}
  /* doc cards (Yes/No + upload) */
  .doc{border:1.5px solid var(--green-l);border-radius:12px;padding:13px;background:#fafffb}
  .doc.no{border-color:var(--red-bd);background:#fff7f7}
  .doc.req-empty{border-color:#e7d7a6;background:#fffdf3}
  .dochd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .dochd .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;color:var(--green);font-size:11px}
  .dochd b{font-size:13px}
  .dochd .avl{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:999px;padding:2px 8px}
  .docq{font-size:12px;color:var(--mut);margin:6px 0 10px}
  .yn{display:flex;gap:9px;margin-bottom:9px}
  .yn button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px;font-weight:700;font-size:12.5px;cursor:pointer;color:#374151;display:flex;gap:6px;justify-content:center;align-items:center}
  .yn button.yes.on{background:var(--green);border-color:var(--green);color:#fff}
  .yn button.no.on{background:var(--red);border-color:var(--red);color:#fff}
  .upl{width:100%;border:1px dashed #b9d8c4;background:#fff;border-radius:9px;padding:9px;font-weight:600;font-size:12px;color:var(--green-d);cursor:pointer;display:flex;gap:7px;justify-content:center;align-items:center}
  .upl.done{border-style:solid;border-color:var(--green);background:var(--green-bg)}
  /* misc */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .pill.green{background:var(--green-l);color:var(--green-d)}
  .pill.greenline{background:#fff;border:1px solid var(--green);color:var(--green-d)}
  .pill.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.grey{background:#f1f3f5;color:#6b7280}
  .pill.dotg:before{content:"●";color:var(--green)}
  .muted{color:var(--mut2)}
  .hint{font-size:11px;color:var(--mut)}
  .banner{border-radius:11px;padding:11px 14px;font-size:12.5px;font-weight:600;display:flex;gap:9px;align-items:center}
  .banner.amber{background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber)}
  .banner.blue{background:var(--blue-bg);border:1px solid #bfdbfe;color:var(--blue)}
  .banner.green{background:var(--green-bg);border:1px solid var(--green-l);color:var(--green-d)}
  .fixtag{display:inline-flex;gap:5px;align-items:center;background:var(--blue-bg);color:var(--blue);border:1px dashed #bfdbfe;border-radius:7px;padding:2px 7px;font-size:10.5px;font-weight:700;cursor:help}
  .hidden{display:none!important}
  /* inbox */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{padding:7px 14px;border-radius:9px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;font-size:12.5px;color:#374151}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:11px 13px;border-bottom:1px solid var(--bd)}
  td{padding:12px 13px;border-bottom:1px solid var(--bd2)}
  tr.lead{cursor:pointer}tr.lead:hover{background:#f9fafb}
  .cardwrap{background:#fff;border:1px solid var(--bd);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  /* toast + autosave */
  .toast{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .tcard{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--green);border-radius:12px;box-shadow:var(--shadow-lg);padding:13px 15px;width:330px;animation:slide .25s ease}
  .tcard.call{border-left-color:var(--blue)}
  @keyframes slide{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .save{position:fixed;left:74px;bottom:16px;z-index:40;background:#111827;color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;opacity:0;transition:.3s;display:flex;gap:7px;align-items:center}
  .save.show{opacity:.92}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:none;align-items:center;justify-content:center}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:520px;max-width:93vw;overflow:hidden}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
  .modal .mb{padding:18px;max-height:74vh;overflow:auto}
  .callbox{background:linear-gradient(180deg,var(--green-bg),#fff);border:1px solid var(--green-l);border-radius:12px;text-align:center;padding:16px;margin-bottom:14px}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;color:var(--green-d)}
  .slider{width:100%;margin:8px 0}
</style>
</head>
<body>
<div class="app">
  <!-- ICON RAIL -->
  <aside class="rail">
    <div class="r on" title="Working" onclick="go('inbox')">▦</div>
    <div class="r" title="Leads" onclick="go('inbox')">☰</div>
    <div class="r" title="Calls">🎧</div>
    <div class="r" title="Docs">▤</div>
    <div class="sp"></div>
    <div class="r" title="Alerts">🔔</div>
    <div class="r" title="Settings">⚙</div>
    <div class="pp" title="Prativa Kar">PK</div>
  </aside>

  <!-- LEFT (timeline) — shown in workspace -->
  <aside class="lpane hidden" id="lpane"></aside>

  <!-- MAIN -->
  <div class="main">
    <div class="urlbar"><span class="lock">🔒</span> <span id="url">retailer-verification-portal.ko-tech.in/leads</span></div>
    <header class="topbar" id="topbar"></header>
    <div class="content" id="content"></div>
  </div>

  <!-- RIGHT chat — shown in workspace -->
  <aside class="chat hidden" id="chat"></aside>
</div>

<div class="save" id="save">💾 All changes saved</div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
/* ===================== demo data ===================== */
const LEADS = [
  {id:'L-4513458', pii:'PII-1374901', name:'Umar Khan', phone:'9988638717', state:'Madhya Pradesh', src:'ksr-app', status:'New', incomplete:false, app:true},
  {id:'L-4513power', pii:'PII-1374902', name:'Ravi Sharma', phone:'9810011223', state:'Uttar Pradesh', src:'ksr-app', status:'Incomplete', incomplete:true, app:true},
  {id:'L-4513221', pii:'PII-1374903', name:'Sukhdev Singh', phone:'9419098765', state:'Jammu & Kashmir', src:'ksr-app', status:'Callback due', incomplete:false, app:false},
  {id:'L-4513090', pii:'PII-1374904', name:'Meena Devi', phone:'9933445566', state:'Bihar', src:'ksr-app', status:'New', incomplete:false, app:false},
];
const STATES=["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Andaman & Nicobar Islands","Chandigarh","Dadra & Nagar Haveli and Daman & Diu","Delhi (NCT)","Jammu & Kashmir","Ladakh","Lakshadweep","Puducherry"];
const REASONS=["Verification Complete","Partial Verification","Callback Requested","Not Interested","Already Customer","Wrong Person","Using Competitor","Price Objection","Trust Issues"];
const TYPE_OUTCOMES=['Farmer','Retailer','Distributor','Other / Non-agri (Unqualified)'];
const CD_REASONS={'Language barrier':"Reassign to an agent who speaks the customer's language",'Customer evasive':"Callback queue (low priority)",'Refused to answer':"Callback queue (low priority)",'Call dropped mid-probe':"Immediate callback scheduled",'Wrong person':"Marked as invalid contact"};
const CB_WHEN=["In 1 hour","Later today","Tomorrow morning","Tomorrow evening","In 2 days"];
const QA_THRESHOLD=45;
/* 8-stage pipeline (matches the live portal) */
const PIPE=['Not Performed','Not Answered','Profile Pending','Profiled','App Download Pending','App Downloaded','Docs Upload','KYC Done'];
const STAGE_IX={contacting:1,profiled:3,kyc:6,verified:7,handed:8};

let cur=null, st={}, callTimer=null, callSecs=0;

/* ===================== nav ===================== */
function go(view){ if(view==='inbox'){cur=null;renderInbox();} }
function fix(n,txt){return `<span class="fixtag" title="${txt}">✓ fix #${n}</span>`}
function showSidePanels(on){
  document.getElementById('lpane').classList.toggle('hidden',!on);
  document.getElementById('chat').classList.toggle('hidden',!on);
  document.querySelector('.rail .r').classList.toggle('on',true);
}

/* ===================== INBOX ===================== */
let inboxTab='open';
function renderInbox(){
  showSidePanels(false);
  document.getElementById('url').textContent='retailer-verification-portal.ko-tech.in/leads';
  document.getElementById('topbar').innerHTML=`
    <div class="lhead"><div><h2>My Leads</h2><div class="hint">Verification Portal · Agent</div></div></div>
    <div class="dial"><span>📞</span><input id="dialin" placeholder="Dial any number…"><button class="btn green sm" onclick="dial()">Call</button></div>`;
  const rows=LEADS.filter(l=>{
    if(inboxTab==='open')return l.status==='New'||l.incomplete;
    if(inboxTab==='callback')return l.status==='Callback due';
    return true;
  }).map(l=>`<tr class="lead" onclick="openLead('${l.id}')">
      <td><b>${l.name}</b><div class="hint">${l.id}</div></td><td>${l.phone}</td><td>${l.state}</td>
      <td>${l.app?'<span class="pill greenline">App Installed</span>':'<span class="pill grey">No app</span>'}</td>
      <td>${badge(l)}</td>
      <td style="text-align:right"><button class="btn green sm" onclick="event.stopPropagation();openLead('${l.id}')">Open</button></td></tr>`).join('');
  document.getElementById('content').innerHTML=`
    <div class="banner blue" style="margin-bottom:14px">ℹ️ Prototype of the <b>redesigned flow</b> on the real portal UI. Open a lead to walk call → profiling outcome → KYC details (view → edit → approve). Hover any <span class="fixtag">✓ fix #N</span> to see the original problem it solves.</div>
    <div class="tabs">

function badge(l){
  if(l.incomplete)return '<span class="pill amber">● Incomplete</span>';
  if(l.status==='Callback due')return '<span class="pill blue">◷ Callback due</span>';
  if(l.status==='New')return '<span class="pill grey">New</span>';
  return `<span class="pill grey">${l.status}</span>`;
}
function dial(){
  const num=document.getElementById('dialin').value.trim();
  if(!num){toast('Enter a number to dial.');return;}
  let l=LEADS.find(x=>x.phone===num);
  if(!l){l={id:'L-'+num.slice(-6),pii:'PII-new',name:'(new) '+num,phone:num,state:'',src:'manual-dial',status:'New',incomplete:false,app:false};LEADS.unshift(l);toast('No lead found — created a minimal lead and starting call.','green');}
  openLead(l.id);
}

function pipeCard(stage){
  const ci=STAGE_IX[stage]!=null?STAGE_IX[stage]:1;
  const chev=PIPE.map((p,i)=>{const cls=i<ci?'':i===ci?'now':'todo';return `<div class="stp ${cls}">${i<ci?'✓ ':''}${p}</div>`}).join('');

  return `<div class="pipecard">
    <div class="pipehd"><div class="pi">📈</div><div><b>Lead Pipeline</b><small>LP-1296122 · KYC</small></div>
      <div style="margin-left:auto" class="hint">${ci>=PIPE.length?'KYC Done':PIPE[Math.min(ci,PIPE.length-1)]} ${fix(3,'One unified pipeline replaces the old 4-stage + 8-stage trackers')}</div></div>
    <div class="lp">${chev}</div>
    <div class="lp"><div class="prog"><i style="width:${pct}%"></i></div></div>
    <div class="legend"><span><i style="background:var(--green)"></i>Done</span><span><i style="background:var(--orange)"></i>Current</span><span><i style="background:#e9ecef"></i>Upcoming</span></div>
  </div>`;
}

/* ===================== FLOW BODY ===================== */
function renderFlow(){
  const s=st[cur.id];
  let html='';
  /* STEP 1 — profiling outcome (smart outcome model) */
  const oc=s.outcome, isType=TYPE_OUTCOMES.includes(oc);
  const s1done=!!oc&&(oc!=="Couldn't determine"||!!s.cdReason)&&(oc!=='Callback needed'||!!s.cbWhen);
  html+=`<div class="step"><div class="sh"><span class="snum ${s1done?'':'todo'}">1</span>
      <div><b>Select Profile Type</b><small>Profiling outcome — must respond, not must classify</small></div>
      <span class="pill blue" style="margin-left:auto">${fix(6,'Profile persists & never auto-resets. “Couldn’t determine (+reason)” is a valid close — agent never stuck')}</span></div>
    <div class="sb">
      <div class="seclab">Guided classifier — answer up to 2 quick questions and the type is set for you</div>
      <div style="margin:10px 0 4px">
        <div class="field" style="margin-bottom:10px"><label>Q1 · Buying for own farm, or to resell?</label>
          <div class="chips"><div class="chip ${s.q1==='own'?'on':''}" onclick="classify('q1','own')">🌾 For own farm</div><div class="chip ${s.q1==='resell'?'on':''}" onclick="classify('q1','resell')">🛒 To resell</div></div></div>
        ${s.q1==='resell'?`<div class="field"><label>Q2 · Sells to farmers directly, or to other shops?</label>
          <div class="chips"><div class="chip ${s.q2==='farmers'?'on':''}" onclick="classify('q2','farmers')">👨‍🌾 To farmers → Retailer</div><div class="chip ${s.q2==='shops'?'on':''}" onclick="classify('q2','shops')">🏬 To other shops → Distributor</div></div></div>`:''}
      </div>
      <div style="border-top:1px solid var(--bd2);margin:13px 0"></div>
      <div class="seclab">Outcome <span style="color:var(--red)">*</span> — required before the call can be closed</div>
      <div class="chips" style="margin:10px 0">
        ${TYPE_OUTCOMES.map(p=>`<div class="chip ${oc===p?'on':''}" onclick="setOutcome('${p}')">${p}</div>`).join('')}
        <div class="chip dash ${oc==="Couldn't determine"?'on':''}" onclick="setOutcome(&quot;Couldn't determine&quot;)">🤷 Couldn't determine</div>
        <div class="chip dash ${oc==='Callback needed'?'on':''}" onclick="setOutcome('Callback needed')">◷ Callback needed</div>
      </div>
      ${isType?`<label class="hint" style="display:flex;gap:7px;align-items:center;margin:2px 0 8px;cursor:pointer"><input type="checkbox" ${s.tentative?'checked':''} onchange="setTentative(this.checked)" style="width:auto;margin:0"> Mark <b style="margin:0 3px">tentative</b> — a lean but not 100% sure (proceeds with confirm-pending flag)</label>`:''}
      ${oc==="Couldn't determine"?cdReasonBlock():''}
      ${oc==='Callback needed'?cbWhenBlock():''}
      ${qaFlagBlock()}
      ${routeNote(isType?oc:'')}
    </div></div>`;
  /* STEP 2 — profile details: view → edit → approve (Retailer) */
  if(s.profile==='Retailer') html+=profileDetailsCard();
  document.getElementById('flowbody').innerHTML=html;
}

function routeNote(p){
  const tnt=(cur&&st[cur.id]&&st[cur.id].tentative)?` <span class="pill amber">tentative · confirm pending</span>`:'';
  if(p==='Farmer')return `<div class="banner green" style="margin-top:6px">🌾 Farmer identified${tnt} → <button class="btn green sm" onclick="handoff('Farmer portal')">Route to Farmer portal</button> No document step here.</div>`;
  if(p==='Distributor')return `<div class="banner green" style="margin-top:6px">🏬 Distributor identified${tnt} → <button class="btn green sm" onclick="handoff('Distributor portal')">Route to Distributor portal</button></div>`;
  if(p&&p.startsWith('Other'))return `<div class="banner amber" style="margin-top:6px">⛔ Non-agri / not a lead → <button class="btn sm" onclick="markUnq()">Mark Unqualified</button></div>`;
  if(p==='Retailer')return `<div class="banner blue" style="margin-top:6px">🛒 Retailer${tnt} → continue to Profile Details below. KYC unlocks app pricing.</div>`;
  return '';
}
function cdReasonBlock(){const s=st[cur.id];
  return `<div class="banner amber" style="margin-bottom:10px">🤷 “Couldn't determine” is a valid close — but the escape isn't free: a reason is <b>required</b> and tracked. ${fix(6,'Agent never stuck; reason gate + per-agent QA keep it honest')}</div>
    <div class="field" style="margin-bottom:8px"><label class="req">Why couldn't the type be determined?</label>
      <select onchange="setCdReason(this.value)"><option value="">— Select reason —</option>${Object.keys(CD_REASONS).map(r=>`<option ${s.cdReason===r?'selected':''}>${r}</option>`).join('')}</select></div>
    ${s.cdReason?`<div class="banner blue" style="margin-bottom:8px">↪ Productive route (never limbo): <b>${CD_REASONS[s.cdReason]}</b></div><button class="btn green sm" onclick="closeCD()">Close lead with this outcome</button>`:''}`;
}
function cbWhenBlock(){const s=st[cur.id];
  return `<div class="field" style="margin:6px 0 8px"><label class="req">Schedule callback for</label>
      <select onchange="setCbWhen(this.value)"><option value="">— When —</option>${CB_WHEN.map(w=>`<option ${s.cbWhen===w?'selected':''}>${w}</option>`).join('')}</select></div>
    ${s.cbWhen?`<button class="btn green sm" onclick="closeCB()">Queue callback (${s.cbWhen})</button>`:''}`;
}
function qaFlagBlock(){const s=st[cur.id],d=s.lastCallSecs||0;
  if(d>=QA_THRESHOLD&&s.outcome==="Couldn't determine")return `<div class="banner amber" style="margin:8px 0;border-style:dashed">🚩 QA flag: a ${d}s call closed as “Couldn't determine” is unusual → routed to QA review. ${fix(3,'Duration is a signal, never a hard gate')}</div>`;
  if(d>0&&d<15&&TYPE_OUTCOMES.includes(s.outcome)&&!s.outcome.startsWith('Other'))return `<div class="banner blue" style="margin:8px 0">ℹ️ Profiled on a short ${d}s call — allowed, but logged as an override for QA.</div>`;
  return '';
}

function docCard(k,label,req){

    <div class="yn"><button class="yes ${has==='yes'?'on':''}" onclick="setHave('${k}','yes')">👍 Yes</button><button class="no ${has==='no'?'on':''}" onclick="setHave('${k}','no')">👎 No</button></div>

function approveBar(){
  const s=st[cur.id],b=s.basic;
  if(s.verified)return `<div class="step" style="border:1px solid var(--green-l);background:var(--green-bg)"><div class="sb" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span style="font-size:22px">✅</span><div style="flex:1"><b style="font-size:14px">KYC approved &amp; handed off to Retailer portal</b><div class="hint">App pricing unlocked for this retailer.</div></div>
    <button class="btn" onclick="callPanel()">📞 Call Now</button></div></div>`;
  const miss=[];
  if(!b.shop)miss.push('shop name');if(!b.pan)miss.push('PAN');if(!b.addr)miss.push('address');if(!b.state)miss.push('state');
  const dl=4-reqDone();if(dl>0)miss.push(dl+' required document'+(dl>1?'s':''));
  const ready=miss.length===0;
  return `<div class="step" style="border:2px solid ${ready?'var(--green)':'var(--bd)'};background:${ready?'linear-gradient(180deg,#f0fdf6,#fff)':'#fff'}">

      <span class="hint">Retailer won’t share documents?</span><button class="btn red sm" onclick="kycRefused()">Mark KYC refused</button></div>
  </div>`;
}

/* ===================== state setters ===================== */
function flag(){const e=document.getElementById('save');e.classList.add('show');clearTimeout(flag._t);flag._t=setTimeout(()=>e.classList.remove('show'),1100);}
function applyOutcome(p){const s=st[cur.id];s.outcome=p;s.profile=p;s.cdReason='';s.cbWhen='';if(p==='Retailer'){if(s.stage==='contacting'||s.stage==='profiled')s.stage='kyc';}else if(s.stage==='contacting')s.stage='profiled';}
function classify(q,v){const s=st[cur.id];s[q]=v;
  if(q==='q1'&&v==='own'){s.q2='';applyOutcome('Farmer');}
  else if(q==='q1'&&v==='resell'){s.q2='';s.outcome='';s.profile='';flag();renderWorkspace();return;}
  else if(q==='q2'&&v==='farmers')applyOutcome('Retailer');
  else if(q==='q2'&&v==='shops')applyOutcome('Distributor');
  flag();renderWorkspace();}
function setOutcome(p){const s=st[cur.id];
  if(TYPE_OUTCOMES.includes(p))applyOutcome(p);
  else{s.outcome=p;s.profile='';s.tentative=false;if(p!=="Couldn't determine")s.cdReason='';if(p!=='Callback needed')s.cbWhen='';}
  flag();renderWorkspace();}
function setTentative(v){st[cur.id].tentative=v;flag();renderFlow();}
function setCdReason(v){st[cur.id].cdReason=v;flag();renderFlow();}
function setCbWhen(v){st[cur.id].cbWhen=v;flag();renderFlow();}
function closeCD(){const s=st[cur.id];cur.status="Couldn't determine";cur.incomplete=false;toast('Closed as “Couldn’t determine” → '+CD_REASONS[s.cdReason],'green');go('inbox');}
function closeCB(){const s=st[cur.id];cur.status='Callback due';cur.incomplete=true;toast('Callback queued — '+s.cbWhen,'green');go('inbox');}
function enterEdit(){const s=st[cur.id];if(!s.basic.name&&cur.name&&!cur.name.startsWith('(new)'))s.basic.name=cur.name;if(!s.basic.phone)s.basic.phone=cur.phone;if(!s.basic.state&&cur.state)s.basic.state=cur.state;s.editing=true;renderFlow();}
function saveEdit(){st[cur.id].editing=false;flag();toast('Details saved','green');renderFlow();}
function cancelEdit(){st[cur.id].editing=false;renderFlow();}
function approveKyc(){const s=st[cur.id];s.verified=true;s.stage='verified';cur.status='Verified';cur.incomplete=false;toast('✓ KYC approved — routing to Retailer portal','green');setTimeout(()=>{s.stage='handed';cur.status='Handed off';renderWorkspace();},700);renderWorkspace();}
function setBasic(k,v){st[cur.id].basic[k]=v;flag();}
function setDoc(k,f,v){const d=st[cur.id].docs;d[k]=d[k]||{};d[k][f]=v;flag();}
function setHave(k,v){const d=st[cur.id].docs;d[k]=d[k]||{};d[k].have=v;if(v==='no'){d[k].file='';d[k].num='';}flag();renderFlow();}
function fakeUpload(k){const d=st[cur.id].docs;d[k]=d[k]||{};d[k].file='scan_'+k+'.jpg';flag();toast('Document committed (auto-saved) — no “Ready to upload” limbo','green');renderFlow();}
function reqDone(){const d=st[cur.id].docs;return ['pesticide','fertilizer','aadhaarF','aadhaarB'].filter(k=>d[k]&&d[k].file).length;}
function handoff(p){st[cur.id].stage='handed';cur.status='Handed off';toast('Handed off to '+p,'green');renderWorkspace();}
function markUnq(){st[cur.id].stage='handed';cur.status='Unqualified';toast('Marked Unqualified','green');go('inbox');}
function kycRefused(){cur.status='KYC refused';toast('Marked “KYC refused” — visible & re-openable, not a dead-end','green');go('inbox');}

/* ===================== CALL + disposition ===================== */
function callPanel(mode){
  let secs=mode==='short'?6:mode==='ok'?24:0;
  openModal(`<div class="mh">📞 Call Disposition <span class="hint" style="font-weight:600">· ${cur.name} · ${cur.id}</span><span class="pill green" style="margin-left:auto" id="cstat">Connected</span></div>
    <div class="mb">
      <div class="callbox"><div class="hint">Call duration (auto-captured) ${fix(2,'Connected/Not-Connected read from telephony — agent never picks it')}</div><div class="timer" id="ctimer">00:${String(secs).padStart(2,'0')}</div></div>
      <div id="dispo"></div></div>`);
  if(mode)finishCall(secs);
  else{callSecs=0;callTimer=setInterval(()=>{callSecs++;document.getElementById('ctimer').textContent='00:'+String(callSecs).padStart(2,'0');},1000);
    document.getElementById('dispo').innerHTML=`<button class="btn green" style="width:100%" onclick="endLive()">End call</button>`;}
}
function endLive(){clearInterval(callTimer);finishCall(callSecs);}
function finishCall(secs){
  if(cur&&st[cur.id])st[cur.id].lastCallSecs=secs;
  const T=15;let routed=secs===0?'notconn':secs<T?'short':'ok';
  const box=document.getElementById('dispo');
  if(routed==='ok'){
    box.innerHTML=`<div class="banner green" style="margin-bottom:12px">✓ Connected ${secs}s (≥ ${T}s) → proceed to disposition &amp; profiling.</div>
      <div class="field" style="margin-bottom:11px"><label class="req">Reason</label><div class="chips" id="rchips">${REASONS.map(r=>`<div class="chip" onclick="this.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${r}</div>`).join('')}</div></div>
      <div class="field" style="margin-bottom:11px"><label>Conversion probability</label><input type="range" class="slider" min="0" max="100" value="50"></div>
      <div class="field" style="margin-bottom:12px"><label class="req">Notes</label><textarea rows="2" placeholder="Key points from the call…"></textarea></div>
      <button class="btn green" style="width:100%" onclick="closeModal();renderWorkspace();toast('Disposition saved — start profiling below','green')">Save Disposition &amp; start profiling</button>`;
  }else if(routed==='short'){
    box.innerHTML=`<div class="banner amber" style="margin-bottom:12px">⏱️ Connected but only ${secs}s (&lt; ${T}s) → default route: <b>Callback queue</b>. ${fix(3,'Short drop routes to callback — not forced misclassification, not lost')}</div>
      <div class="banner blue" style="margin-bottom:12px">But if you <b>did</b> identify the profile in those ${secs}s, you may override:</div>
      <div style="display:flex;gap:10px"><button class="btn green" style="flex:1" onclick="closeModal();toast('Queued for callback (attempt logged)','green')">Send to Callback queue</button>
      <button class="btn" style="flex:1" onclick="closeModal();renderWorkspace();toast('Override: set the outcome below (logged for QA)','green')">I identified it — let me profile</button></div>`;
  }else{
    box.innerHTML=`<div class="banner amber" style="margin-bottom:12px">☎️ Not connected → auto-queued for callback (attempt +1). After 3 failed/short attempts → <b>Unreachable</b>.</div>
      <button class="btn green" style="width:100%" onclick="closeModal();toast('Callback scheduled','green')">OK</button>`;
  }
}
/* incoming-call interrupt (non-hijacking) */
function simIncoming(){
  pushToast('call',`<div style="display:flex;gap:10px;align-items:center"><div style="font-size:20px">📲</div>
    <div style="flex:1"><b>Incoming call</b> +91 90011 22334<div class="hint">Your current lead stays open &amp; saved ${fix(1,'Incoming call does NOT replace the open profile — it waits here')}</div></div></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn green sm" style="flex:1" onclick="toast('Opened the new caller — previous lead auto-saved under “Incomplete”.');this.closest('.tcard').remove()">Open when ready</button>
    <button class="btn sm" onclick="this.closest('.tcard').remove()">Ignore</button></div>`);
}
/* helpers */
function toast(msg,kind){pushToast('',`<div style="display:flex;gap:9px;align-items:center"><span>${kind==='green'?'✅':'ℹ️'}</span><div>${msg}</div></div>`,3200);}
function pushToast(cls,html,ttl){const t=document.createElement('div');t.className='tcard '+(cls||'');t.innerHTML=html;document.getElementById('toast').appendChild(t);if(ttl)setTimeout(()=>t.remove(),ttl);}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('ov').classList.add('show');}
function closeModal(){document.getElementById('ov').classList.remove('show');if(callTimer)clearInterval(callTimer);}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});

/* init */
renderInbox();
if(location.hash.indexOf('lead=')>-1)openLead(location.hash.split('lead=')[1]);
</script>
</body>
</html>
