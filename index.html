<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Portal — Agent</title>
<style>
  :root{
    --green:#1aa45c; --green-d:#15803d; --green-2:#27b169; --green-l:#dcfce7; --green-bg:#f0fdf6;
    --orange:#ef9b0a;
    --bg:#f3f5f7; --card:#ffffff; --bd:#e6e8ec; --bd2:#eef0f3;
    --ink:#1f2733; --mut:#6b7280; --mut2:#9aa3af;
    --red:#dc2626; --red-bg:#fef2f2; --red-bd:#f6c9ca;
    --blue:#2563eb; --blue-bg:#eff6ff; --amber:#b45309; --amber-bg:#fffbeb; --amber-bd:#fde68a;
    --purple:#7c3aed; --purple-bg:#f1ebfe;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
    --shadow-lg:0 14px 38px rgba(16,24,40,.17);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
  .ic{display:inline-flex;align-items:center;justify-content:center}
  .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
  .ic.sm svg{width:14px;height:14px}
  .app{display:flex;min-height:100vh}
  /* ---------- sidebar ---------- */
  .side{width:218px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--bd2)}
  .brand .lg{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
  .brand b{font-size:13.5px}.brand small{display:block;color:var(--mut);font-size:10.5px}
  .nav{flex:1;overflow:auto;padding:6px 0}
  .ngrp{color:var(--mut2);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:14px 16px 5px;font-weight:700}
  .nav a{display:flex;align-items:center;gap:11px;padding:8px 16px;color:#374151;text-decoration:none;font-weight:500;cursor:pointer;border-left:3px solid transparent;font-size:13px}
  .nav a .ic{width:16px;text-align:center;opacity:.8}
  .nav a:hover{background:#f9fafb}
  .nav a.on{background:var(--green-bg);color:var(--green-d);border-left-color:var(--green);font-weight:600}
  .nav a .ch{margin-left:auto;color:var(--mut2);font-size:11px}
  .agent{padding:11px 16px;border-top:1px solid var(--bd2);display:flex;gap:10px;align-items:center}
  .agent .av{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
  .agent b{font-size:12px;display:block}.agent small{font-size:10px;color:var(--mut)}
  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .content{padding:18px 22px;overflow:auto}
  .dial{display:flex;gap:7px;align-items:center;background:#f1f3f5;border-radius:9px;padding:4px 4px 4px 11px}
  .dial input{border:0;background:transparent;outline:0;width:150px;font-size:12.5px}
  /* ---------- buttons ---------- */
  .btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 13px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;color:#374151}
  .btn:hover{background:#f9fafb}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.green:hover{background:var(--green-d)}
  .btn.greenbright{background:linear-gradient(180deg,var(--green-2),var(--green));border-color:var(--green);color:#fff;box-shadow:0 4px 13px rgba(26,164,92,.4)}
  .btn.red{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
  .btn.pill{border-radius:999px}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn.lg{padding:13px 26px;font-size:15px;border-radius:12px;font-weight:700}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px}
  .card .bd{padding:16px 18px}
  /* header card */
  .lhd{display:flex;align-items:center;gap:13px;padding:14px 18px;flex-wrap:wrap}
  .lhd .av{width:46px;height:46px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
  .lhd h2{margin:0;font-size:18px;font-weight:800}
  .ids{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:5px}
  .idp{border-radius:7px;padding:2px 8px;font-size:10.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center}
  .idp.g{background:var(--green-l);color:var(--green-d)} .idp.p{background:var(--purple-bg);color:var(--purple)} .idp.n{background:#f1f3f5;color:#5b6473}
  .lhd .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  /* pipeline */
  .piphd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .piphd .pi{width:30px;height:30px;border-radius:8px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center}
  .piphd b{font-size:14px}.piphd small{display:block;color:var(--mut2);font-size:11px;letter-spacing:.04em}
  .lp{display:flex}
  .lp .stp{flex:1;min-width:0;background:var(--green);color:#fff;font-size:11px;font-weight:600;text-align:center;padding:10px 6px 10px 20px;margin-right:-10px;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp .stp:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:13px}
  .lp .stp.now{background:var(--orange)} .lp .stp.todo{background:#e9ecef;color:#9aa3af}
  .prog{height:5px;border-radius:3px;background:#e9ecef;margin-top:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin-top:9px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  /* tabs */
  .tabs2{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:0;background:#fff;border-radius:14px 14px 0 0;padding:4px 10px 0;overflow:auto}
  .tabs2 a{padding:11px 15px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
  .tabs2 a .ct{background:#f1f3f5;border-radius:999px;font-size:10px;padding:0 6px;color:#6b7280}
  .tabs2 a.on{color:var(--green-d);border-bottom-color:var(--green)}
  /* form */
  .sec{border:1px solid var(--bd2);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .sec>.sh{display:flex;align-items:center;gap:9px;padding:12px 15px;background:#fbfcfd;font-weight:700;font-size:13.5px;cursor:default}
  .sec>.sh .cv{margin-left:auto;color:var(--mut2)}
  .sec>.sb{padding:15px}
  .field label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;outline:0;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
  .field input::placeholder{color:#b6bcc6}
  .field.err input{border-color:var(--red-bd);background:#fff8f8}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .req:after{content:" *";color:var(--red)}
  /* view rows */
  .vrow .lab{font-size:11px;color:var(--mut2);font-weight:600}
  .vrow .val{font-weight:600;margin-top:2px;font-size:13.5px}
  .vrow .val .muted{color:var(--mut2);font-weight:500}
  /* header KYC action row + hover checklist */
  .kactrow{border-top:1px solid var(--bd2);padding:11px 18px;display:flex;align-items:center;gap:10px}
  .kbar{display:flex;align-items:center;gap:9px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .apwrap{position:relative;display:inline-block}
  .popchk{display:none;position:absolute;right:0;top:calc(100% + 9px);width:290px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;z-index:30}
  .apwrap:hover .popchk{display:block}
  .popchk:before{content:"";position:absolute;right:24px;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid var(--bd);border-top:1px solid var(--bd);transform:rotate(45deg)}
  .popchk h5{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut2);font-weight:700}
  .popchk .ck{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--bd2)}
  .popchk .ck:last-child{border-bottom:0}
  .popchk .ck .i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}
  .popchk .ck.ok{color:var(--mut)} .popchk .ck.ok .i{background:var(--green-l);color:var(--green-d)}
  .popchk .ck.no{color:var(--ink);font-weight:600} .popchk .ck.no .i{background:var(--red-bg);color:var(--red)}
  /* KYC status pill (traffic-light) */
  .kstat{font-size:13.5px;font-weight:800;padding:10px 16px;border-radius:11px;display:inline-flex;gap:7px;align-items:center;border:1.5px solid}
  .kstat.n{background:#f1f3f5;color:#6b7280;border-color:#dde1e6}
  .kstat.g{background:var(--green-bg);color:var(--green-d);border-color:var(--green)}
  .kstat.r{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
  /* compact read-only view */
  .vpanel{border:1px solid var(--bd2);border-radius:12px;padding:2px 16px 14px;background:#fcfdfe}
  .vhdr{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green-d);padding:13px 0 9px;border-bottom:1px solid var(--bd2);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .vhdr .n{margin-left:auto;color:var(--mut2);font-weight:600;letter-spacing:0;text-transform:none}
  .vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px 20px;margin-bottom:4px}
  .cv{display:flex;flex-direction:column;gap:1px;min-width:0}
  .cl{font-size:10px;color:var(--mut2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .cvv{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cvv .muted{color:#c2c7cf;font-weight:500}
  .docg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:2px}
  .dchip{display:flex;align-items:center;gap:8px;border:1px solid var(--bd2);border-radius:9px;padding:8px 10px;font-size:12px;background:#fff}
  .dchip.req{border-color:var(--red-bd);background:#fff8f8}
  .dchip b{font-size:12px;font-weight:600} .dchip .x{margin-left:auto;font-size:10px;color:var(--mut2)}
  .dmark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}
  .dmark.ok{background:var(--green-l);color:var(--green-d)} .dmark.no{background:var(--red-bg);color:var(--red)} .dmark.op{background:#f1f3f5;color:var(--mut2)}
  /* doc tiles */
  .doc{border:1.5px solid var(--green-l);border-radius:12px;padding:12px;background:#fafffb;position:relative}
  .doc.req{border-color:var(--red-bd);background:#fff8f8}
  .doc .avl{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;color:#fff;background:var(--green);border-radius:6px;padding:2px 7px}
  .doc .reqm{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;color:#fff;background:var(--red);border-radius:6px;padding:2px 7px}
  .doc .nm{font-size:12.5px;font-weight:700}
  .doc .thumb{height:74px;border-radius:8px;background:#eef1f4 center/cover;margin:9px 0;display:grid;place-items:center;color:#9aa3af;font-size:11px;overflow:hidden}
  .doc .upl{width:100%;border:1px dashed #b9d8c4;background:#fff;border-radius:9px;padding:18px 9px;font-weight:600;font-size:11.5px;color:var(--green-d);cursor:pointer;display:flex;flex-direction:column;gap:5px;justify-content:center;align-items:center;text-align:center}
  .doc .upl.r{border-color:var(--red-bd);color:var(--red)}
  .doc small.exp{font-size:10.5px;color:var(--mut)}
  /* verification status */
  .vstat{border:1px solid var(--bd);border-radius:12px;padding:15px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fbfcfd}
  .vstat.ok{background:var(--green-bg);border-color:var(--green-l)}
  .toggle{width:46px;height:25px;border-radius:999px;background:#cfd5dc;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
  .toggle.on{background:var(--green)} .toggle i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on i{left:23px}
  /* misc */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .pill.green{background:var(--green-l);color:var(--green-d)} .pill.greenline{background:#fff;border:1px solid var(--green);color:var(--green-d)}
  .pill.amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)} .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.blue{background:var(--blue-bg);color:var(--blue)} .pill.grey{background:#f1f3f5;color:#6b7280}
  .pill.dotg:before{content:"●";color:var(--green)}
  .sq{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#6b7280}
  .sq:before{content:"";width:11px;height:11px;border-radius:3px;display:inline-block}
  .sq.draft:before{background:#f1c40f} .sq.api:before{background:var(--green)}
  .muted{color:var(--mut2)} .hint{font-size:11px;color:var(--mut)}
  .banner{border-radius:11px;padding:11px 14px;font-size:12.5px;font-weight:600;display:flex;gap:9px;align-items:center}
  .banner.amber{background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber)}
  .banner.blue{background:var(--blue-bg);border:1px solid #bfdbfe;color:var(--blue)}
  .banner.green{background:var(--green-bg);border:1px solid var(--green-l);color:var(--green-d)}
  .fixtag{display:inline-flex;gap:5px;align-items:center;background:var(--blue-bg);color:var(--blue);border:1px dashed #bfdbfe;border-radius:7px;padding:2px 7px;font-size:10px;font-weight:700;cursor:help}
  .hidden{display:none!important}
  /* inbox */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{padding:7px 14px;border-radius:9px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;font-size:12.5px;color:#374151}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:11px 13px;border-bottom:1px solid var(--bd)}
  td{padding:12px 13px;border-bottom:1px solid var(--bd2)}
  tr.lead{cursor:pointer}tr.lead:hover{background:#f9fafb}
  /* action bar (sticky approve) */
  .actbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--bd);margin:0 -22px -18px;padding:13px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(16,24,40,.05);z-index:5}
  /* toast + modal */
  .toast{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .tcard{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--green);border-radius:12px;box-shadow:var(--shadow-lg);padding:13px 15px;width:330px;animation:slide .25s ease}
  .tcard.call{border-left-color:var(--blue)} @keyframes slide{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .save{position:fixed;left:230px;bottom:16px;z-index:40;background:#111827;color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;opacity:0;transition:.3s}.save.show{opacity:.92}
  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:none;align-items:center;justify-content:center}.ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:520px;max-width:93vw;overflow:hidden}
  .modal .mh{padding:15px 18px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
  .modal .mb{padding:18px;max-height:74vh;overflow:auto}
  .callbox{background:linear-gradient(180deg,var(--green-bg),#fff);border:1px solid var(--green-l);border-radius:12px;text-align:center;padding:16px;margin-bottom:14px}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;color:var(--green-d)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#374151}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
</style>
</head>

/* mandatory checks for approval (shown on hover over Approve) */
function checks(){
  const s=st[cur.id], b=s.b;
  return [
    {label:'Connected call logged',ok:!!s.callDone},
    {label:'Partner app installed',ok:!!cur.app},
    {label:'Profile type selected',ok:!!b.ptype},
    {label:'Personal details (name)',ok:!!b.first},
    {label:'Business details (shop, PAN, address, state)',ok:!!(b.shop&&b.pan&&b.addr&&b.state)},
    {label:'All '+REQ_DOCS.length+' required documents',ok:reqDone()===REQ_DOCS.length},
  ];
}
/* KYC traffic-light + approve (lives in the header card, at top) */
function kycActionBar(){
  const s=st[cur.id];
  const status=s.verified?'approved':s.rejected?'rejected':'pending';
  const pill=status==='approved'?`<span class="kstat g">${ic('check')} KYC Approved</span>`
            :status==='rejected'?`<span class="kstat r">${ic('x')} KYC Rejected</span>`
            :`<span class="kstat n">● Not Approved</span>`;
  if(status!=='pending') return `<div class="kbar">${pill}<button class="btn sm" onclick="reopenKyc()">${ic('reopen','sm')} Re-open</button></div>`;
  const chk=checks(), ready=chk.every(c=>c.ok), pend=chk.filter(c=>!c.ok).length;
  const items=chk.map(c=>`<div class="ck ${c.ok?'ok':'no'}"><span class="i">${c.ok?'✓':'!'}</span>${c.label}</div>`).join('');
  return `<div class="kbar">${pill}
    <button class="btn red sm" onclick="rejectKyc()">${ic('x','sm')} Reject</button>
    <span class="apwrap"><button class="btn greenbright lg" ${ready?'':'disabled'} onclick="approve()">${ic('check')} Approve &amp; Verify KYC</button>
      <div class="popchk"><h5>${ready?'All checks passed — ready':pend+' pending check'+(pend>1?'s':'')+' for approval'}</h5>${items}</div></span></div>`;
}

function editForm(){
  const s=st[cur.id],b=s.b;
  const f=(lab,key,ph,req)=>`<div class="field"><label class="${req?'req':''}">${lab}</label><input value="${b[key]||''}" oninput="setB('${key}',this.value)" placeholder="${ph||''}"></div>`;
  const sel=(lab,key,opts,req)=>`<div class="field"><label class="${req?'req':''}">${lab}</label><select onchange="setB('${key}',this.value)">${['<option value="">— Select —</option>'].concat(opts.map(o=>`<option ${b[key]===o?'selected':''}>${o}</option>`)).join('')}</select></div>`;

      <div class="grid3">${sel('State','state',STATES,true)}${f('Country','country','India')}<div></div></div>

/* ---- state ---- */
function filledAny(){const b=st[cur.id].b;return b.first||b.shop||b.pan||b.addr||b.state||reqDone()>0;}
function reqDone(){const d=st[cur.id].docs;return REQ_DOCS.filter(k=>d[k]&&d[k].file).length;}
function missing(){const b=st[cur.id].b,m=[];if(!b.ptype)m.push('profile type');if(!b.first)m.push('first name');if(!b.shop)m.push('shop name');if(!b.pan)m.push('PAN');if(!b.addr)m.push('shop address');if(!b.state)m.push('state');const dl=REQ_DOCS.length-reqDone();if(dl>0)m.push(dl+' required document'+(dl>1?'s':''));return m;}
function enterEdit(){const s=st[cur.id];if(!s.b.first&&cur.name&&!cur.name.startsWith('(new)')){const p=cur.name.split(' ');s.b.first=p[0];s.b.last=p.slice(1).join(' ');}if(!s.b.phone)s.b.phone=cur.phone;if(!s.b.state&&cur.state)s.b.state=cur.state;s.editing=true;renderRI();}
function saveEdit(){st[cur.id].editing=false;flag();toast('Details saved','green');renderRI();}
function cancelEdit(){st[cur.id].editing=false;renderRI();}
function setB(k,v){st[cur.id].b[k]=v;flag();}
function setDoc(k,f,v){const d=st[cur.id].docs;d[k]=d[k]||{};d[k][f]=v;flag();}
function upDoc(k){const d=st[cur.id].docs;d[k]=d[k]||{};d[k].file='scan_'+k+'.jpg';flag();toast('Document uploaded & auto-saved','green');renderRI();}
function approve(){const s=st[cur.id];s.verified=true;s.rejected=false;s.editing=false;cur.status='Verified';cur.incomplete=false;toast('✓ KYC approved & verified — handed off to Retailer portal','green');renderLead();}
function rejectKyc(){const s=st[cur.id];s.rejected=true;s.verified=false;s.editing=false;cur.status='KYC rejected';cur.incomplete=false;toast('✕ KYC rejected — visible & re-openable for a future attempt','green');renderLead();}
function reopenKyc(){const s=st[cur.id];s.verified=false;s.rejected=false;cur.status='Incomplete';cur.incomplete=true;toast('Re-opened — status reset to pending','green');renderLead();}
function markCallDone(){if(cur&&st[cur.id]){st[cur.id].callDone=true;renderLead();}}

/* ===================== CALL + disposition ===================== */
function callPanel(mode){let secs=mode==='short'?6:mode==='ok'?24:0;
  openModal(`<div class="mh">📞 Call Disposition <span class="hint" style="font-weight:600">· ${cur.name} · ${cur.id}</span><span class="pill green" style="margin-left:auto">Connected</span></div>
    <div class="mb"><div class="callbox"><div class="hint">Call duration (auto-captured) ${fix(2,'Connected/Not-Connected read from telephony — agent never picks it')}</div><div class="timer" id="ctimer">00:${String(secs).padStart(2,'0')}</div></div><div id="dispo"></div></div>`);
  if(mode)finishCall(secs);else{callSecs=0;callTimer=setInterval(()=>{callSecs++;document.getElementById('ctimer').textContent='00:'+String(callSecs).padStart(2,'0');},1000);document.getElementById('dispo').innerHTML=`<button class="btn green" style="width:100%" onclick="endLive()">End call</button>`;}}
function endLive(){clearInterval(callTimer);finishCall(callSecs);}
function finishCall(secs){const T=15;const box=document.getElementById('dispo');
  if(secs>=T){box.innerHTML=`<div class="banner green" style="margin-bottom:12px">✓ Connected ${secs}s (≥ ${T}s).</div>
    <div class="field" style="margin-bottom:11px"><label class="req">Reason</label><div class="chips">${REASONS.map(r=>`<div class="chip" onclick="this.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${r}</div>`).join('')}</div></div>
    <div class="field" style="margin-bottom:11px"><label>Conversion probability</label><input type="range" min="0" max="100" value="50" style="width:100%"></div>
    <div class="field" style="margin-bottom:12px"><label class="req">Notes</label><textarea rows="2" placeholder="Key points…"></textarea></div>
    <button class="btn green" style="width:100%" onclick="markCallDone();closeModal();toast('Disposition saved — connected call logged','green')">Save Disposition</button>`;}
  else if(secs>0){box.innerHTML=`<div class="banner amber" style="margin-bottom:12px">⏱️ Only ${secs}s (&lt; ${T}s) → Callback queue.</div><button class="btn green" style="width:100%" onclick="closeModal();toast('Queued for callback','green')">OK</button>`;}
  else{box.innerHTML=`<div class="banner amber" style="margin-bottom:12px">☎️ Not connected → callback (+1 attempt).</div><button class="btn green" style="width:100%" onclick="closeModal();toast('Callback scheduled','green')">OK</button>`;}}
function toast(m,k){pushToast('',`<div style="display:flex;gap:9px;align-items:center"><span>${k==='green'?'✅':'ℹ️'}</span><div>${m}</div></div>`,3200);}
function pushToast(c,h,ttl){const t=document.createElement('div');t.className='tcard '+(c||'');t.innerHTML=h;document.getElementById('toast').appendChild(t);if(ttl)setTimeout(()=>t.remove(),ttl);}
function openModal(h){document.getElementById('modal').innerHTML=h;document.getElementById('ov').classList.add('show');}
function closeModal(){document.getElementById('ov').classList.remove('show');if(callTimer)clearInterval(callTimer);}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});

/* init */
document.querySelectorAll('span.ic[data-ic]').forEach(e=>{e.innerHTML='<svg viewBox="0 0 24 24">'+(IC[e.dataset.ic]||'')+'</svg>'});
renderInbox();
if(location.hash.indexOf('lead=')>-1)openLead(location.hash.split('lead=')[1]);
</script>
</body>
</html>
